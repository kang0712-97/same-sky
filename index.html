<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Same Sky · 같은 하늘</title>
<meta name="description" content="서로 다른 하늘 아래, 하나의 하루. 장거리 연애 커플을 위한 도트 일상 공유 화면.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="title"><h1>SAME SKY</h1><p>다른 곳에 있어도, 같은 하늘 아래.</p></div>

<div class="desk" id="desk">
 <div class="ss">
  <div class="bar"><span class="dot f"></span><span class="dot"></span><span class="dot"></span><span style="flex:1;text-align:center;letter-spacing:3px">SAME SKY</span><button class="mini" id="editMe" hidden>내 정보</button><span style="font-size:13px" id="live">…</span></div>

  <!-- 처음 등록 -->
  <div class="view" id="v-setup">
   <form class="setup" id="setupForm" autocomplete="off">
    <h2 id="setupTitle">먼저 내 정보를 등록해요</h2>
    <fieldset>
     <legend>나</legend>
     <label class="fld">이름<input id="me-name" maxlength="10" placeholder="예: 유노" required></label>
     <div class="fld">아바타
      <div class="avs" id="me-avs"></div>
      <details class="up"><summary>내 이미지로 도트 캐릭터 만들기</summary>
       <div class="upbody">
        <label class="btn small">이미지 선택<input id="me-file" type="file" accept="image/*" hidden></label>
        <label class="inl"><input type="radio" name="me-mode" value="full" checked> 전신 캐릭터</label>
        <label class="inl"><input type="radio" name="me-mode" value="face"> 얼굴 프로필</label>
        <div class="hint">전신은 AI로 만든 캐릭터 이미지(단색 배경)가 잘 나와요. 얼굴 사진은 '얼굴 프로필'로 쓰세요.</div>
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" id="me-prev" class="prev" hidden>
       </div>
      </details>
     </div>
     <div class="fld">내 지역
      <div class="srch"><input id="me-q" placeholder="도시 이름 (예: 서울, Seoul)"><button type="button" class="btn small" id="me-go">검색</button></div>
      <div class="cities" id="me-list"></div><div class="picked" id="me-picked">아직 선택 안 함</div>
     </div>
    </fieldset>
    <fieldset>
     <legend>상대</legend>
     <label class="fld">이름<input id="pt-name" maxlength="10" placeholder="예: 무노" required></label>
     <div class="fld">아바타<div class="avs" id="pt-avs"></div></div>
     <div class="fld">상대 지역
      <div class="srch"><input id="pt-q" placeholder="도시 이름 (예: 뉴욕, New York)"><button type="button" class="btn small" id="pt-go">검색</button></div>
      <div class="cities" id="pt-list"></div><div class="picked" id="pt-picked">아직 선택 안 함</div>
     </div>
    </fieldset>
    <div class="row2"><button type="button" class="btn" id="setupCancel" hidden>취소</button><button class="btn p" type="submit">시작하기</button></div>
    <div class="err" id="setupErr"></div>
   </form>
  </div>

  <!-- 홈 -->
  <div class="view" id="v-home">
   <div class="twin">
    <div class="badge" id="diff">시차</div>
    <div class="pane"><div id="st-me"></div><div class="plate"><div class="who"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" id="pf-me" class="pf" hidden><div><b id="n-me">나</b><div class="sub"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" id="moonIcon" style="width:15px"><span id="w-me"></span></div></div></div><div class="t" id="t-me">--:--</div></div></div>
    <div class="pane"><div id="st-pt"></div><div class="plate"><div class="who"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" id="pf-pt" class="pf" hidden><div><b id="n-pt">상대</b><div class="sub"><span id="w-pt"></span></div></div></div><div class="t" id="t-pt">--:--</div></div></div>
   </div>
   <div class="foot">
    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" id="globe" style="width:130px;image-rendering:pixelated">
    <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px">
     <div style="font-size:13px" id="moonTxt"></div>
     <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn p" id="goTown">▶ 상대 동네 가보기</button><button class="btn" id="photo">▣ 오늘의 사진 (0/3)</button></div>
    </div>
   </div>
  </div>

  <!-- 상대 동네 -->
  <div class="view town" id="v-town">
   <div class="head"><b id="townTitle"></b><button class="btn" id="back" style="flex:0;min-width:0;padding:8px 14px">◀ 돌아가기</button></div>
   <div style="max-width:560px;margin:0 auto;border-left:4px solid var(--ink);border-right:4px solid var(--ink)"><div id="st-town"></div></div>
   <div class="emptyhint" id="noteEmpty">아직 쪽지가 없어요. 첫 쪽지를 남겨보세요.</div>
   <div class="foot" style="border-top:4px solid var(--ink)"><input id="noteIn" maxlength="24" placeholder="쪽지 남기기 (최대 24자)"><button class="btn p" id="addNote" style="flex:0;min-width:0">붙이기</button></div>
  </div>
  <div class="toast" id="toast"></div>
 </div>
</div>

<div class="demo" id="demo" hidden><b>데모 컨트롤</b>
 나 <select id="sel-me"></select> 상대 <select id="sel-pt"></select>
 <button id="real">실제 날씨 불러오기</button><button id="reset">처음부터 다시</button><span id="status"></span>
</div>

<script src="src/assets.js"></script>
<script src="src/dotify.js"></script>
<script src="src/app.js"></script>
</body>
</html>
